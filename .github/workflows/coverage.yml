name: Coverage report
on:
  workflow_run:
    workflows: ["BuildStockBatch Tests"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Post coverage report to PR
    runs-on: ubuntu-latest
    # Only run when the test workflow succeeded AND it was triggered by a PR
    if: >
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'
      }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_commit.id }}
      - name: Dump artifacts for the run
        run: |
          gh api \
            /repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts \
            --jq '.artifacts[].name'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: coverage-report-xml
          path: buildstockbatch/coverage

      - name: Generate coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: buildstockbatch/coverage/coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          output: both
          indicators: true
          thresholds: '33 75'

      - name: Comment on the PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          number: ${{ github.event.workflow_run.pull_requests[0].number }}
          path: code-coverage-results.md
